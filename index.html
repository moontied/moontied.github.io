<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alea's Planner ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf6ee;
    --card: #ffffff;
    --accent1: #e8734a;
    --accent2: #5b8fa8;
    --accent3: #7dab6e;
    --accent4: #c96b9e;
    --accent5: #9b7bc8;
    --text: #2a1f1a;
    --muted: #9a8a80;
    --border: #e8ddd5;
    --shadow: rgba(90,50,30,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* SYNC STATUS */
  #syncStatus {
    position: fixed;
    bottom: 1.2rem;
    right: 1.2rem;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0.5rem 0.9rem;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    box-shadow: 0 4px 16px var(--shadow);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    z-index: 200;
    transition: all 0.3s;
  }
  #syncDot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ccc;
    transition: background 0.3s;
  }
  #syncStatus.synced #syncDot   { background: #7dab6e; }
  #syncStatus.syncing #syncDot  { background: #e8c34a; animation: pulse 1s infinite; }
  #syncStatus.error #syncDot    { background: #e8734a; }
  #syncStatus.offline #syncDot  { background: #aaa; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }



  /* HEADER */
  header {
    background: linear-gradient(135deg, #e8734a 0%, #c96b9e 50%, #9b7bc8 100%);
    padding: 2.2rem 2.5rem 1.8rem;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.07'%3E%3Ccircle cx='30' cy='30' r='4'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-size: 2.6rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
    position: relative;
  }
  header p {
    color: rgba(255,255,255,0.8);
    font-size: 0.95rem;
    margin-top: 0.3rem;
    font-weight: 300;
    position: relative;
  }
  .date-badge {
    position: absolute;
    top: 2rem;
    right: 2.5rem;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    padding: 0.5rem 1rem;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 500;
    backdrop-filter: blur(4px);
  }

  /* NAV TABS */
  nav {
    display: flex;
    gap: 0;
    background: #fff;
    border-bottom: 2px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    padding: 1rem 1.5rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent1); }
  .tab-btn .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  /* MAIN */
  main { padding: 2rem 2.5rem; max-width: 1100px; margin: 0 auto; }
  .section { display: none; }
  .section.active { display: block; }

  /* SECTION HEADERS */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 1.6rem;
    font-weight: 700;
  }
  .add-btn {
    background: var(--accent1);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0.6rem 1.3rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: opacity 0.2s, transform 0.1s;
    box-shadow: 0 3px 12px rgba(232,115,74,0.3);
  }
  .add-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .add-btn:active { transform: translateY(0); }

  /* CARDS */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 1.3rem 1.4rem;
    border: 1.5px solid var(--border);
    box-shadow: 0 2px 12px var(--shadow);
    position: relative;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--shadow); }
  .card-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    opacity: 0.7;
  }
  .card-title {
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 0.35rem;
  }
  .card-sub {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  .card-note {
    font-size: 0.83rem;
    color: var(--text);
    opacity: 0.75;
    margin-top: 0.4rem;
  }
  .card-actions {
    position: absolute;
    top: 1rem;
    right: 1rem;
    display: flex;
    gap: 0.4rem;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .card:hover .card-actions { opacity: 1; }
  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 0.3rem 0.5rem;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--muted);
    transition: all 0.15s;
  }
  .icon-btn:hover { background: #f5ece6; color: var(--accent1); border-color: var(--accent1); }
  .icon-btn.del:hover { background: #fde8e8; color: #c0392b; border-color: #c0392b; }

  /* PRIORITY BADGE */
  .badge {
    display: inline-block;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.2rem 0.55rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .badge-high { background: #fde8e8; color: #c0392b; }
  .badge-med { background: #fff3e0; color: #d4780a; }
  .badge-low { background: #e8f5e9; color: #2e7d32; }
  .badge-upcoming { background: #e3f2fd; color: #1565c0; }
  .badge-done { background: #f3e5f5; color: #6a1b9a; }

  /* SCHEDULE - weekly grid */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.8rem;
  }
  .day-col {
    background: var(--card);
    border-radius: 14px;
    border: 1.5px solid var(--border);
    overflow: hidden;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .day-header {
    padding: 0.7rem 1rem;
    font-weight: 600;
    font-size: 0.88rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .day-today { border: 2px solid var(--accent1) !important; }
  .day-today .day-header { background: linear-gradient(135deg, #e8734a, #c96b9e); color: #fff; }
  .day-events { padding: 0.6rem; display: flex; flex-direction: column; gap: 0.5rem; min-height: 80px; }
  .event-chip {
    border-radius: 8px;
    padding: 0.45rem 0.7rem;
    font-size: 0.8rem;
    font-weight: 500;
    position: relative;
  }
  .event-time {
    font-size: 0.7rem;
    opacity: 0.7;
    display: block;
    margin-top: 0.1rem;
  }
  .add-event-btn {
    width: 100%;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 0.4rem;
    cursor: pointer;
    border-top: 1px solid var(--border);
    transition: color 0.15s;
  }
  .add-event-btn:hover { color: var(--accent1); }

  /* TASKS */
  .tasks-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .task-item {
    background: var(--card);
    border-radius: 12px;
    padding: 1rem 1.2rem;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 2px 8px var(--shadow);
    transition: transform 0.15s;
  }
  .task-item:hover { transform: translateX(3px); }
  .task-item.done { opacity: 0.55; }
  .task-item.done .task-title { text-decoration: line-through; }
  .task-checkbox {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: #fff;
  }
  .task-checkbox.checked { background: var(--accent3); border-color: var(--accent3); color: #fff; }
  .task-title { font-weight: 500; font-size: 0.95rem; flex: 1; }
  .task-meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(42,31,26,0.45);
    backdrop-filter: blur(3px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 20px;
    padding: 2rem;
    width: 90%;
    max-width: 460px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    margin-bottom: 1.3rem;
  }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0.65rem 0.9rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--text);
    background: var(--bg);
    transition: border-color 0.2s;
    resize: vertical;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none;
    border-color: var(--accent1);
  }
  .modal-actions { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.5rem; }
  .btn-cancel {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem 1.2rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    color: var(--muted);
  }
  .btn-save {
    background: var(--accent1);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0.6rem 1.4rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(232,115,74,0.3);
  }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
  }
  .empty-icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
  .empty p { font-size: 0.9rem; }

  /* COLOR ACCENT STRIPS */
  .strip-orange { border-left: 4px solid var(--accent1); }
  .strip-blue   { border-left: 4px solid var(--accent2); }
  .strip-green  { border-left: 4px solid var(--accent3); }
  .strip-pink   { border-left: 4px solid var(--accent4); }
  .strip-purple { border-left: 4px solid var(--accent5); }

  .color-orange { background: #fef0ea; color: var(--accent1); }
  .color-blue   { background: #e8f4f8; color: var(--accent2); }
  .color-green  { background: #eef7ec; color: var(--accent3); }
  .color-pink   { background: #fce8f3; color: var(--accent4); }
  .color-purple { background: #f0ebfa; color: var(--accent5); }

  .due-soon { border-color: #ffd5b8; background: #fffaf7; }

  /* LOADING OVERLAY */
  #loadingOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    gap: 1rem;
    transition: opacity 0.4s;
  }
  #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent1);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingOverlay p { color: var(--muted); font-size: 0.9rem; }

  @media (max-width: 700px) {
    main { padding: 1.2rem 1rem; }
    .week-grid { grid-template-columns: 1fr 1fr; }
    .card-grid { grid-template-columns: 1fr; }
    header { padding: 1.5rem 1.2rem 1.2rem; }
    header h1 { font-size: 2rem; }
    .date-badge { display: none; }
  }
</style>
</head>
<body>

<!-- Loading screen -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <p>Connecting to your planner…</p>
</div>

<header>
  <h1>Alea's Planner ✨</h1>
  <p>Stay on top of everything — schedule, homework, projects & more</p>
  <div class="date-badge" id="dateBadge"></div>
</header>

<nav>
  <button class="tab-btn active" onclick="showTab('schedule')" data-tab="schedule">
    <span class="dot" style="background:#e8734a"></span> Schedule
  </button>
  <button class="tab-btn" onclick="showTab('tasks')" data-tab="tasks">
    <span class="dot" style="background:#7dab6e"></span> Tasks
  </button>
  <button class="tab-btn" onclick="showTab('homework')" data-tab="homework">
    <span class="dot" style="background:#5b8fa8"></span> Homework
  </button>
  <button class="tab-btn" onclick="showTab('projects')" data-tab="projects">
    <span class="dot" style="background:#c96b9e"></span> Projects
  </button>
  <button class="tab-btn" onclick="showTab('tests')" data-tab="tests">
    <span class="dot" style="background:#9b7bc8"></span> Tests & Quizzes
  </button>
</nav>

<main>
  <!-- SCHEDULE -->
  <div class="section active" id="section-schedule">
    <div class="section-header">
      <div class="section-title">Weekly Schedule</div>
      <button class="add-btn" onclick="openModal('schedule')">+ Add Class / Event</button>
    </div>
    <div class="week-grid" id="weekGrid"></div>
  </div>

  <!-- TASKS -->
  <div class="section" id="section-tasks">
    <div class="section-header">
      <div class="section-title">To-Do Tasks</div>
      <button class="add-btn" onclick="openModal('task')">+ Add Task</button>
    </div>
    <div class="tasks-list" id="tasksList"></div>
  </div>

  <!-- HOMEWORK -->
  <div class="section" id="section-homework">
    <div class="section-header">
      <div class="section-title">Homework</div>
      <button class="add-btn" onclick="openModal('homework')">+ Add Homework</button>
    </div>
    <div class="card-grid" id="homeworkGrid"></div>
  </div>

  <!-- PROJECTS -->
  <div class="section" id="section-projects">
    <div class="section-header">
      <div class="section-title">Upcoming Projects</div>
      <button class="add-btn" onclick="openModal('project')">+ Add Project</button>
    </div>
    <div class="card-grid" id="projectsGrid"></div>
  </div>

  <!-- TESTS -->
  <div class="section" id="section-tests">
    <div class="section-header">
      <div class="section-title">Tests & Quizzes</div>
      <button class="add-btn" onclick="openModal('test')">+ Add Test / Quiz</button>
    </div>
    <div class="card-grid" id="testsGrid"></div>
  </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2 id="modalTitle">Add Item</h2>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveModal()">Save ✓</button>
    </div>
  </div>
</div>

<!-- Sync status indicator -->
<div id="syncStatus" class="syncing">
  <div id="syncDot"></div>
  <span id="syncText">Connecting…</span>
</div>

<!-- ===============================================================
     FIREBASE SDK  (v9 compat — works in plain HTML, no bundler)
     =============================================================== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// ================================================================
//  🔥 STEP 1 — REPLACE THIS CONFIG WITH YOURS FROM FIREBASE
//  Go to: Firebase Console → Your Project → Project Settings → Web App
// ================================================================
const firebaseConfig = {
  apiKey: "AIzaSyAmMrgvslkNmrOkEDfXqrDnfl1IoBkj7Zg",
  authDomain: "alea-planner.firebaseapp.com",
  databaseURL: "https://alea-planner-default-rtdb.firebaseio.com",
  projectId: "alea-planner",
  storageBucket: "alea-planner.firebasestorage.app",
  messagingSenderId: "1089435878912",
  appId: "1:1089435878912:web:d0a49f458a01f43c24bae5",
  measurementId: "G-FG5Y2NZX0W"
};
// ================================================================

// Init Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const plannerRef = db.ref('aleaPlanner');

// ===== SYNC STATUS =====
function setSyncStatus(state, text) {
  const el = document.getElementById('syncStatus');
  el.className = state;
  document.getElementById('syncText').textContent = text;
}

// ===== LOCAL DATA CACHE =====
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
const DAY_COLORS = ['color-orange','color-blue','color-green','color-pink','color-purple'];

let data = { schedule: [], tasks: [], homework: [], projects: [], tests: [] };

// ===== FIREBASE SAVE =====
async function save() {
  setSyncStatus('syncing', 'Saving…');
  try {
    // Convert arrays to objects keyed by id for Firebase
    const payload = {};
    ['schedule','tasks','homework','projects','tests'].forEach(key => {
      payload[key] = {};
      data[key].forEach(item => { payload[key][item.id] = item; });
    });
    await plannerRef.set(payload);
    setSyncStatus('synced', 'Saved ✓');
  } catch(e) {
    console.error(e);
    setSyncStatus('error', 'Save failed');
  }
}

// ===== LISTEN FOR REALTIME UPDATES =====
plannerRef.on('value', snapshot => {
  const val = snapshot.val();
  if (val) {
    // Convert Firebase objects back to arrays
    ['schedule','tasks','homework','projects','tests'].forEach(key => {
      data[key] = val[key] ? Object.values(val[key]) : [];
    });
  } else {
    data = { schedule: [], tasks: [], homework: [], projects: [], tests: [] };
  }
  setSyncStatus('synced', 'Live ✓');
  document.getElementById('loadingOverlay').classList.add('hidden');
  renderAll();
}, err => {
  console.error(err);
  setSyncStatus('error', 'Connection error');
  document.getElementById('loadingOverlay').innerHTML = `
    <div style="text-align:center;padding:2rem;color:#c0392b">
      <p style="font-size:1.1rem;margin-bottom:0.5rem">⚠️ Could not connect to Firebase</p>
      <p style="font-size:0.85rem;color:#888">Check your Firebase config and database rules.</p>
    </div>`;
});

// ===== DATE =====
const today = new Date();
document.getElementById('dateBadge').textContent = today.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

function getTodayDay() {
  const d = today.getDay();
  if(d >= 1 && d <= 5) return DAYS[d-1];
  return null;
}

// ===== TABS =====
function showTab(tab) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-'+tab).classList.add('active');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
}

// ===== RENDER =====
function renderAll() {
  renderSchedule();
  renderTasks();
  renderCards('homework', 'homeworkGrid');
  renderCards('projects', 'projectsGrid');
  renderCards('tests', 'testsGrid');
}

function renderSchedule() {
  const grid = document.getElementById('weekGrid');
  const todayDay = getTodayDay();
  grid.innerHTML = DAYS.map((day, i) => {
    const events = data.schedule.filter(e => e.day === day).sort((a,b) => a.time.localeCompare(b.time));
    const isToday = day === todayDay;
    return `
      <div class="day-col ${isToday ? 'day-today' : ''}">
        <div class="day-header" style="${isToday ? '' : 'background:#f8f4f1;'}">
          <span>${day.slice(0,3)}</span>
          ${isToday ? '<span style="font-size:0.75rem;opacity:0.85">Today</span>' : ''}
        </div>
        <div class="day-events">
          ${events.length ? events.map(e => `
            <div class="event-chip ${DAY_COLORS[i]}" style="position:relative">
              <strong style="font-size:0.82rem">${esc(e.name)}</strong>
              <span class="event-time">${e.time}${e.endTime ? ' – '+e.endTime : ''}${e.location ? ' · '+esc(e.location) : ''}</span>
              <button class="icon-btn del" style="position:absolute;top:4px;right:4px;opacity:0;font-size:0.7rem"
                onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=0"
                onclick="deleteItem('schedule','${e.id}')">✕</button>
            </div>
          `).join('') : '<p style="font-size:0.78rem;color:#bbb;padding:0.3rem 0.2rem">Nothing yet</p>'}
        </div>
        <button class="add-event-btn" onclick="openModalForDay('${day}')">+ Add</button>
      </div>
    `;
  }).join('');
}

function daysUntil(dateStr) {
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return Math.round((d - new Date(today.toDateString())) / 86400000);
}

function dueBadge(dateStr) {
  if(!dateStr) return '';
  const diff = daysUntil(dateStr);
  if(diff < 0) return '<span class="badge badge-high">Overdue</span>';
  if(diff === 0) return '<span class="badge badge-high">Due Today!</span>';
  if(diff === 1) return '<span class="badge badge-med">Due Tomorrow</span>';
  if(diff <= 3) return `<span class="badge badge-med">Due in ${diff} days</span>`;
  return `<span class="badge badge-low">Due ${new Date(dateStr+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>`;
}

function priorityBadge(p) {
  if(!p) return '';
  const map = {High:'badge-high',Medium:'badge-med',Low:'badge-low'};
  return `<span class="badge ${map[p]||''}">${p}</span>`;
}

function typeBadge(t) {
  if(!t) return '';
  const map = {Test:'badge-high',Quiz:'badge-upcoming','Final Exam':'badge-high','Midterm':'badge-med'};
  return `<span class="badge ${map[t]||'badge-low'}">${t}</span>`;
}

function renderCards(type, gridId) {
  const grid = document.getElementById(gridId);
  const items = data[type];
  if(!items.length) {
    const emojis = {homework:'📚',projects:'🚀',tests:'📝'};
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">${emojis[type]}</div><p>No ${type} added yet. Hit the button to add one!</p></div>`;
    return;
  }
  const strips = ['strip-blue','strip-pink','strip-purple','strip-orange','strip-green'];
  grid.innerHTML = items.map((item, idx) => {
    const diff = item.dueDate ? daysUntil(item.dueDate) : null;
    const urgent = diff !== null && diff <= 2;
    return `
      <div class="card ${strips[idx%5]} ${urgent ? 'due-soon' : ''}">
        <div class="card-actions">
          <button class="icon-btn" onclick="openEditModal('${type}','${item.id}')">✏️</button>
          <button class="icon-btn del" onclick="deleteItem('${type}','${item.id}')">🗑</button>
        </div>
        <div class="card-label" style="color:var(--muted)">${esc(item.subject||item.class||'')}</div>
        <div class="card-title">${esc(item.name)}</div>
        ${item.dueDate ? `<div class="card-sub" style="margin-bottom:0.5rem">${dueBadge(item.dueDate)}</div>` : ''}
        ${item.priority ? `<div style="margin-bottom:0.4rem">${priorityBadge(item.priority)}</div>` : ''}
        ${item.type ? `<div style="margin-bottom:0.4rem">${typeBadge(item.type)}</div>` : ''}
        ${item.notes ? `<div class="card-note">${esc(item.notes)}</div>` : ''}
      </div>
    `;
  }).join('');
}

function renderTasks() {
  const list = document.getElementById('tasksList');
  const items = data.tasks;
  if(!items.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">✅</div><p>No tasks yet — add something to get started!</p></div>`;
    return;
  }
  list.innerHTML = items.map(t => `
    <div class="task-item ${t.done ? 'done' : ''}">
      <div class="task-checkbox ${t.done ? 'checked' : ''}" onclick="toggleTask('${t.id}')">
        ${t.done ? '✓' : ''}
      </div>
      <div style="flex:1">
        <div class="task-title">${esc(t.name)}</div>
        <div class="task-meta">
          ${t.dueDate ? '📅 ' + new Date(t.dueDate+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : ''}
          ${t.priority ? ' · ' + t.priority + ' priority' : ''}
        </div>
      </div>
      ${t.dueDate ? dueBadge(t.dueDate) : ''}
      <div class="card-actions" style="opacity:1;position:static">
        <button class="icon-btn del" onclick="deleteItem('tasks','${t.id}')">🗑</button>
      </div>
    </div>
  `).join('');
}

// ===== MODAL =====
const FORMS = {
  schedule: {
    title: 'Add Class / Event',
    fields: [
      {key:'name', label:'Class / Event Name', type:'text', placeholder:'e.g. Math, Basketball Practice'},
      {key:'day', label:'Day', type:'select', options:DAYS},
      {key:'time', label:'Start Time', type:'time'},
      {key:'endTime', label:'End Time', type:'time'},
      {key:'location', label:'Location (optional)', type:'text', placeholder:'e.g. Room 204'},
    ]
  },
  task: {
    title: 'Add Task',
    fields: [
      {key:'name', label:'Task', type:'text', placeholder:'What needs to get done?'},
      {key:'dueDate', label:'Due Date', type:'date'},
      {key:'priority', label:'Priority', type:'select', options:['Low','Medium','High']},
    ]
  },
  homework: {
    title: 'Add Homework',
    fields: [
      {key:'name', label:'Assignment', type:'text', placeholder:'e.g. Chapter 5 Reading'},
      {key:'subject', label:'Subject', type:'text', placeholder:'e.g. English'},
      {key:'dueDate', label:'Due Date', type:'date'},
      {key:'priority', label:'Priority', type:'select', options:['Low','Medium','High']},
      {key:'notes', label:'Notes', type:'textarea', placeholder:'Any extra details...'},
    ]
  },
  project: {
    title: 'Add Project',
    fields: [
      {key:'name', label:'Project Name', type:'text', placeholder:'e.g. Science Fair Project'},
      {key:'subject', label:'Class / Subject', type:'text', placeholder:'e.g. Biology'},
      {key:'dueDate', label:'Due Date', type:'date'},
      {key:'priority', label:'Priority', type:'select', options:['Low','Medium','High']},
      {key:'notes', label:'Description / Notes', type:'textarea', placeholder:'What does this project involve?'},
    ]
  },
  test: {
    title: 'Add Test / Quiz',
    fields: [
      {key:'name', label:'Name / Topic', type:'text', placeholder:'e.g. Chapter 3 Vocabulary'},
      {key:'subject', label:'Class / Subject', type:'text', placeholder:'e.g. Spanish'},
      {key:'type', label:'Type', type:'select', options:['Quiz','Test','Midterm','Final Exam']},
      {key:'dueDate', label:'Date', type:'date'},
      {key:'notes', label:'Topics to Study', type:'textarea', placeholder:'Key topics, formulas, vocab...'},
    ]
  }
};

let currentModal = null;
let editId = null;

function openModal(type, prefillDay) {
  currentModal = type;
  editId = null;
  const form = FORMS[type];
  document.getElementById('modalTitle').textContent = form.title;
  document.getElementById('modalBody').innerHTML = buildFormHTML(form.fields, {day: prefillDay});
  document.getElementById('modalOverlay').classList.add('open');
}

function openModalForDay(day) { openModal('schedule', day); }

function openEditModal(type, id) {
  currentModal = type;
  editId = id;
  const item = data[type].find(i => i.id === id);
  if(!item) return;
  const form = FORMS[type];
  document.getElementById('modalTitle').textContent = 'Edit ' + form.title.replace('Add ','');
  document.getElementById('modalBody').innerHTML = buildFormHTML(form.fields, item);
  document.getElementById('modalOverlay').classList.add('open');
}

function buildFormHTML(fields, prefill) {
  prefill = prefill || {};
  return fields.map(f => {
    if(f.type === 'select') {
      return `<div class="form-group">
        <label>${f.label}</label>
        <select id="f_${f.key}">
          <option value="">Select…</option>
          ${(f.options||[]).map(o => `<option value="${o}" ${prefill[f.key]===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>`;
    }
    if(f.type === 'textarea') {
      return `<div class="form-group">
        <label>${f.label}</label>
        <textarea id="f_${f.key}" rows="3" placeholder="${f.placeholder||''}">${esc(prefill[f.key]||'')}</textarea>
      </div>`;
    }
    return `<div class="form-group">
      <label>${f.label}</label>
      <input type="${f.type}" id="f_${f.key}" placeholder="${f.placeholder||''}" value="${esc(prefill[f.key]||'')}">
    </div>`;
  }).join('');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  currentModal = null; editId = null;
}

function closeModalOutside(e) {
  if(e.target === document.getElementById('modalOverlay')) closeModal();
}

function saveModal() {
  const form = FORMS[currentModal];
  const obj = { id: editId || uid() };
  form.fields.forEach(f => {
    const el = document.getElementById('f_'+f.key);
    obj[f.key] = el ? el.value.trim() : '';
  });
  if(!obj.name) { alert('Please enter a name.'); return; }

  const key = currentModal === 'task' ? 'tasks' :
               currentModal === 'schedule' ? 'schedule' :
               currentModal === 'homework' ? 'homework' :
               currentModal === 'project' ? 'projects' : 'tests';

  if(editId) {
    const idx = data[key].findIndex(i => i.id === editId);
    if(idx !== -1) data[key][idx] = obj;
  } else {
    data[key].push(obj);
  }
  closeModal();
  save(); // Firebase save — re-render triggered by the listener
}

// ===== ACTIONS =====
function deleteItem(type, id) {
  if(!confirm('Delete this item?')) return;
  data[type] = data[type].filter(i => i.id !== id);
  save();
}

function toggleTask(id) {
  const t = data.tasks.find(i => i.id === id);
  if(t) { t.done = !t.done; save(); }
}

function uid() { return Math.random().toString(36).slice(2,10); }
function esc(str) {
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
